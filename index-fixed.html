<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موسوعة النباتات العُمانية</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0e1812;font-family:Tahoma,Arial,sans-serif;color:#fff}button{font:inherit}.screen{display:none;min-height:100vh}.screen.active{display:block}.hero{position:relative;min-height:100vh;background:center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,19,13,.12),rgba(9,19,13,.28))}.start{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);border:1px solid #d5b56c;background:#294735e8;color:#fff;padding:15px 34px;border-radius:999px;cursor:pointer;box-shadow:0 8px 30px #0005}.families{background:#f0e3cd url('assets/02_Plant-Families.png') center/cover no-repeat;position:relative}.topbar{position:absolute;top:3%;left:3%;right:3%;display:flex;justify-content:space-between;align-items:center;z-index:4}.pill{background:#183425df;border:1px solid #c7a767;color:white;border-radius:999px;padding:9px 16px}.family-card{position:absolute;border:1px solid #d6b66f;background:#183425d9;color:#fff;border-radius:22px;padding:15px 20px;cursor:pointer;min-width:170px;text-align:center;box-shadow:0 12px 30px #0004}.family-card b{display:block;font-size:20px}.family-card small{color:#e7d6ad}.sidr{left:16%;top:34%}.fab{right:16%;top:34%}.exhibit{position:relative;min-height:100vh;background:#d9c3a2 center/cover no-repeat;overflow:hidden}.nav{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:7px;z-index:8;background:#173626e8;border:1px solid #c8a55e;padding:7px;border-radius:22px;direction:rtl}.nav button{border:0;background:transparent;color:#f6e8c9;padding:9px 12px;border-radius:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#c8a55e22}.back{position:absolute;top:3%;right:3%;z-index:9}.models{position:absolute;left:4%;top:9%;width:49%;height:70%;z-index:5;display:none}.models.open{display:block}.models model-viewer{width:100%;height:100%;background:transparent}.model-close{position:absolute;left:1%;top:1%;z-index:9}.model-btn{position:absolute;left:6%;bottom:8%;z-index:8}.watchbox{position:absolute;inset:8% 8% 16%;background:#10241be8;border:1px solid #c7a767;border-radius:24px;z-index:12;display:none;padding:18px}.watchbox.open{display:block}.watchbox video,.watchbox iframe{width:100%;height:100%;border:0;border-radius:16px;background:#000}.watchbox .x{position:absolute;top:-12px;left:-12px}.plant-switch{position:absolute;top:3%;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:7px}.plant-switch button{border:1px solid #c7a767;background:#173626df;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}@media(max-width:700px){.family-card{min-width:125px;padding:10px;font-size:13px}.family-card b{font-size:16px}.sidr{left:5%}.fab{right:5%}.nav{width:96%;overflow:auto;justify-content:flex-start}.nav button{white-space:nowrap;padding:8px}.models{left:2%;top:10%;width:62%;height:62%}}
</style>
<style>
/* Use the artwork itself as the interface */
.start,.topbar,.back,.plant-switch,.model-btn,.nav{display:none!important}

/* Family names already printed in the artwork */
.family-card{
  position:absolute!important;
  z-index:20!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  padding:0!important;
  min-width:0!important;
  color:transparent!important;
  font-size:0!important;
  cursor:pointer!important;
}
.family-card b,.family-card small{display:none!important}

/* Hotspots over the printed family labels in 02_Plant-Families.png */
.family-card.sidr{left:0!important;top:0!important;width:50%!important;height:100%!important}
.family-card.fab{right:0!important;top:0!important;width:50%!important;height:100%!important}

/* Start hotspot over the button already drawn in 01_Entrance.png */
#startHotspot{
  position:absolute;inset:0;
  width:100%;height:100%;
  z-index:20;border:0;background:transparent;cursor:pointer;
}

/* Six transparent hotspots over the navigation strip already drawn into plant artwork */
#artNav{
  position:absolute;left:32.2%;bottom:1.4%;width:35.6%;height:8.2%;
  z-index:25;display:grid;grid-template-columns:repeat(6,1fr);
  direction:ltr;
}
#artNav button{border:0;background:transparent;cursor:pointer;padding:0}

/* 3D model is part of the "تعرّف عليه" slide */
.models{
  display:none!important;
  position:absolute!important;
  left:4%!important;
  top:13%!important;
  width:38%!important;
  height:62%!important;
  z-index:15!important;
  pointer-events:auto;
  background:transparent!important;
}
.models.intro3d{display:block!important}
.model-close{display:none!important}
.models model-viewer{width:100%;height:100%;background:transparent}

/* Keep video overlay functional when شاهد is selected */
.watchbox{z-index:40!important}

@media(max-width:700px){
  #artNav{left:22%;width:56%;bottom:1%;height:9%}
  .models{left:1%!important;top:16%!important;width:45%!important;height:52%!important}
}
</style>
</head><body>
<section id="home" class="screen active"><div class="hero" style="background-image:url('assets/01_Entrance.png')"><div class="shade"></div><button id="startHotspot" aria-label="ابدأ رحلة الاستكشاف" onclick="show('families')"></button></div></section>
<section id="families" class="screen families"><div class="topbar"><button class="pill" onclick="show('home')">الرئيسية</button><button class="pill" onclick="toggleVoice()">🔊 الصوت</button></div><button class="family-card sidr" onclick="openPlant('sidr')"><b>الفصيلة النبقية</b><small>السدر • Rhamnaceae</small></button><button class="family-card fab" onclick="openPlant('ghaf')"><b>الفصيلة البقولية</b><small>الغاف • السَّلَم • Fabaceae</small></button></section>
<section id="exhibit" class="screen exhibit"><button class="pill back" onclick="show('families')">← الفصائل</button><div class="plant-switch"><button onclick="openPlant('ghaf')">الغاف</button><button onclick="openPlant('salam')">السَّلَم</button><button onclick="openPlant('sidr')">السدر</button></div><button class="pill model-btn" onclick="toggleModel()">◉ عرض 3D</button><div id="modelWrap" class="models"><button class="pill model-close" onclick="toggleModel(false)">✕</button><model-viewer id="mv" camera-controls interaction-prompt="none" shadow-intensity="1" exposure="1.05" auto-rotate></model-viewer></div><div id="watchbox" class="watchbox"><button class="pill x" onclick="closeWatch()">✕</button><div id="watchcontent" style="width:100%;height:100%"></div></div><div id="artNav"><button data-tab="intro" aria-label="تعرّف عليه" onclick="tab('intro',this)"></button><button data-tab="harvest" aria-label="الحصاد والاستفادة" onclick="tab('harvest',this)"></button><button data-tab="uses" aria-label="الاستخدامات" onclick="tab('uses',this)"></button><button data-tab="culture" aria-label="الثقافة" onclick="tab('culture',this)"></button><button data-tab="habitat" aria-label="الموطن" onclick="tab('habitat',this)"></button><button data-tab="watch" aria-label="شاهد" onclick="tab('watch',this)"></button></div></section>
<audio id="voice" src="media/1(6).mp3"></audio><script>
const plants={sidr:{model:'models/01-01_Sidr_3D.glb',tabs:{intro:'assets/03_Plant-Introduction.png',harvest:'assets/04_Harvesting.png',uses:'assets/05_Uses.png',culture:'assets/06_Culture-Heritage.png',habitat:'assets/07_Habitat.png',watch:'assets/08_Watch.png'},video:'media/01-01_Sidr_Video.mp4'},ghaf:{model:'models/02-02_Ghaf_3D.glb',tabs:{intro:'assets/02-02_Ghaf_Introduction.png',harvest:'assets/02-02_Ghaf_Harvesting.png',uses:'assets/02-02_Ghaf_Uses.png',culture:'assets/02-02_Ghaf_Culture-Heritage.png',habitat:'assets/02-02_Ghaf_Habitat.png',watch:'assets/02-02_Ghaf_Watch.png'}},salam:{model:'models/02-02_Salam_3D.glb',tabs:{intro:'assets/02-02_Salam_Introduction.png',harvest:'assets/02-02_Salam_Harvesting.png',uses:'assets/02-02_Salam_Uses.png',culture:'assets/02-02_Salam_Culture-Heritage.png',habitat:'assets/02-02_Salam_Habitat.png',watch:'assets/02-02_Salam_Watch.png'}}};let current='sidr';
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='families'){document.getElementById('voice').play().catch(()=>{})}else document.getElementById('voice').pause()}
function openPlant(p){current=p;show('exhibit');document.getElementById('mv').src=plants[p].model;tab('intro',document.querySelector('#artNav [data-tab=intro]'));closeWatch()}
function tab(t,b){document.getElementById('exhibit').style.backgroundImage=`url("${plants[current].tabs[t]}")`;const m=document.getElementById('modelWrap');m.classList.toggle('intro3d',t==='intro');if(t==='watch')openWatch();else closeWatch()}
function toggleModel(force){const w=document.getElementById('modelWrap');w.classList.toggle('open',force===undefined?!w.classList.contains('open'):force)}
function openWatch(){const box=document.getElementById('watchbox'),c=document.getElementById('watchcontent');box.classList.add('open');if(plants[current].video)c.innerHTML=`<video controls autoplay src="${plants[current].video}"></video>`;else c.innerHTML='<div style="height:100%;display:grid;place-items:center;text-align:center"><div><h2>فيديو النبات</h2><p>مكان جاهز لإضافة فيديو YouTube الموثوق لهذا النبات.</p></div></div>'}
function closeWatch(){document.getElementById('watchbox').classList.remove('open');document.getElementById('watchcontent').innerHTML=''}function toggleVoice(){const a=document.getElementById('voice');a.paused?a.play().catch(()=>{}):a.pause()}
</script></body></html>
